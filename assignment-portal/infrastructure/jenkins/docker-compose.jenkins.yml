version: '3.8'

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-docker-agent:lts
    container_name: jenkins-ci
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-home:/var/jenkins_home
      # Mount host Docker socket so Jenkins agent can build and run Docker containers
      # NOTE: In production environments, use isolated DinD (Docker-in-Docker) or Kubernetes agents.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true

volumes:
  jenkins-home:
    name: jenkins-ci-home
