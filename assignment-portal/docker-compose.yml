
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: assignment-portal-backend:latest
    container_name: assignment-portal-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in root .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: assignment-portal-frontend:latest
    container_name: assignment-portal-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    networks:
      - app-network

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-uploads:
    name: assignment-portal-uploads

networks:
  app-network:
    name: assignment-portal-network
    driver: bridge
