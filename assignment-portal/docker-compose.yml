services:

  mongodb:
    image: mongo:7.0
    container_name: assignment-portal-mongodb
    restart: unless-stopped

    ports:
      - "27018:27017"

    environment:
      MONGO_INITDB_DATABASE: assignment_portal

    volumes:
      - mongo-data:/data/db

    networks:
      - app-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: assignment-portal-backend:latest
    container_name: assignment-portal-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/assignment_portal
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10

    volumes:
      - backend-uploads:/app/uploads

    networks:
      - app-network

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: assignment-portal-frontend:latest
    container_name: assignment-portal-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    networks:
      - app-network

    depends_on:
      backend:
        condition: service_healthy


volumes:
  mongo-data:
    name: assignment-portal-mongo-data

  backend-uploads:
    name: assignment-portal-uploads


networks:
  app-network:
    name: assignment-portal-network
    driver: bridge